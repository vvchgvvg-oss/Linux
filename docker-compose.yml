services:
  desktop:
    build: .
    restart: unless-stopped
    environment:
      VNC_PASSWORD: ${VNC_PASSWORD:?Set an 8-character VNC_PASSWORD in .env}
      VNC_GEOMETRY: ${VNC_GEOMETRY:-1280x720}
    expose:
      - "6080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:6080/vnc.html >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - desktop_net

  gateway:
    build: ./gateway
    restart: unless-stopped
    depends_on:
      desktop:
        condition: service_healthy
    environment:
      WEB_USER: ${WEB_USER:-desktop}
      WEB_PASSWORD: ${WEB_PASSWORD:?Set a unique WEB_PASSWORD in .env}
    ports:
      - "${PORT:-8080}:80"
    networks:
      - desktop_net

networks:
  desktop_net:
